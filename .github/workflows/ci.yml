name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v --cov=numpy_choice_shuffle_guard --cov-report=term-missing
      - name: Smoke-test installed console script
        run: |
          numpy-choice-shuffle-guard --version
          numpy-choice-shuffle-guard detect --json | python -m json.tool > /dev/null || true
          # --trials 100 is a smoke test of the command itself (does it run,
          # is the JSON well-formed), not a statistical convergence check --
          # with only 100 trials over a 200-item population the frequency
          # comparison can legitimately exceed --tolerance and exit 1, so
          # `|| true` here on purpose; the real statistical check runs at
          # the default --trials (2000) via the test suite's own test_cli.py.
          numpy-choice-shuffle-guard verify --json --trials 100 | python -m json.tool > /dev/null || true

  build-artifact:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the built wheel on this Linux runner
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/numpy-choice-shuffle-guard --version
          # detect exits 1 when the bug is confirmed present, which is the
          # expected/likely finding on a fresh numpy install as of this
          # writing -- only fail the smoke test on an unexpected exit code
          # (anything other than 0=not-affected or 1=affected).
          set +e
          /tmp/smoke-venv/bin/numpy-choice-shuffle-guard detect --json > /tmp/smoke-out.json
          code=$?
          set -e
          echo "detect exit=$code"
          test "$code" -eq 0 -o "$code" -eq 1
          python3 -m json.tool /tmp/smoke-out.json
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
